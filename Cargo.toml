[package]
name = "bevy-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.16", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_window",
    "webgpu",
] }
wasm-bindgen = "=0.2.115"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["OffscreenCanvas"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify-next = { version = "0.5", features = ["js"] }

[profile.release]
opt-level = "s"
